<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <!-- Background & Border -->
  <rect width="800" height="400" fill="#0d1117" rx="8" />
  <rect x="1" y="1" width="798" height="398" fill="none" stroke="#30363d" stroke-width="2" rx="8" />

  <!-- Title & Subtitle -->
  <text x="40" y="40" fill="#f0f6fc" font-size="18" font-weight="bold">Centipawn Evaluation Drift</text>
  <text x="40" y="60" fill="#8b949e" font-size="12">Tracking engine evaluation shifts across game plies (Critical blunder highlighted)</text>

  <!-- Grid Lines -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="80" y1="100" x2="740" y2="100" />
    <line x1="80" y1="160" x2="740" y2="160" />
    <line x1="80" y1="220" x2="740" y2="220" />
    <line x1="80" y1="280" x2="740" y2="280" />
  </g>

  <!-- Y-Axis Labels -->
  <text x="65" y="104" fill="#8b949e" font-size="11" text-anchor="end">+3.0</text>
  <text x="65" y="164" fill="#8b949e" font-size="11" text-anchor="end">+1.5</text>
  <text x="65" y="224" fill="#8b949e" font-size="11" text-anchor="end">0.0</text>
  <text x="65" y="284" fill="#8b949e" font-size="11" text-anchor="end">-1.5</text>

  <!-- X-Axis Labels -->
  <text x="120" y="315" fill="#8b949e" font-size="11" text-anchor="middle">Ply 10</text>
  <text x="275" y="315" fill="#8b949e" font-size="11" text-anchor="middle">Ply 20</text>
  <text x="430" y="315" fill="#8b949e" font-size="11" text-anchor="middle">Ply 30</text>
  <text x="585" y="315" fill="#8b949e" font-size="11" text-anchor="middle">Ply 40</text>
  <text x="740" y="315" fill="#8b949e" font-size="11" text-anchor="middle">Ply 50</text>

  <!-- Axes -->
  <line x1="80" y1="220" x2="740" y2="220" stroke="#8b949e" stroke-width="1.5" />
  <line x1="80" y1="90" x2="80" y2="290" stroke="#8b949e" stroke-width="1.5" />

  <!-- Axis Titles -->
  <text x="410" y="350" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">Game Ply</text>
  <text x="25" y="190" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle" transform="rotate(-90 25 190)">Centipawn (CP)</text>

  <!-- Evaluation Curve (Blue Line) -->
  <path d="M 100 230 Q 250 235, 400 225 T 585 190 L 650 110" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" />

  <!-- Blunder Marker (Red Dot) -->
  <circle cx="650" cy="110" r="7" fill="#f85149" stroke="#ffffff" stroke-width="2" />
  <text x="650" y="90" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">Blunder (Eval Drop)</text>
</svg>